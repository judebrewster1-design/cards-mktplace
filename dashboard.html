<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Shop — The Long Box</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="shop-sign">
  <div class="shop-sign__inner">
    <a href="index.html" class="shop-sign__title">🃏 The Long Box<small>PEI Card Exchange</small></a>
    <nav class="shop-nav">
      <a href="marketplace.html">Listings</a>
      <a href="wanted.html">Wanted</a>
      <a href="chat.html">Chat</a>
      <a href="dashboard.html" class="active">My Shop</a>
    </nav>
    <div class="shop-nav" id="nav-auth-slot"></div>
  </div>
</header>

<div class="wrap">
  <h1 class="page-title">My Shop</h1>
  <p class="page-sub">/// Basic settings, your active posts, and making new ones</p>

  <div class="tabs">
    <button class="active" data-tab="posts">My Posts</button>
    <button data-tab="new">Make a Listing</button>
    <button data-tab="settings">Settings</button>
  </div>

  <section id="tab-posts" class="panel">
    <h2>Your active posts</h2>
    <ul class="mini-list" id="my-listings">
      <li>Loading…</li>
    </ul>
  </section>

  <section id="tab-new" class="panel hidden">
    <h2>Make a listing</h2>
    <form id="listing-form">
      <div class="two-col">
        <div>
          <label for="l-card">Card name</label>
          <input id="l-card" required placeholder="Start typing… e.g. Lightning Bolt" autocomplete="off" />
          <div class="price-suggest hidden" id="price-suggest"></div>

          <label for="l-set">Set (optional)</label>
          <input id="l-set" placeholder="e.g. Dominaria Remastered" />

          <label for="l-condition">Condition</label>
          <select id="l-condition">
            <option>Near Mint</option>
            <option>Lightly Played</option>
            <option>Moderately Played</option>
            <option>Heavily Played</option>
            <option>Damaged</option>
          </select>

          <label for="l-price">Your price ($)</label>
          <input id="l-price" type="number" step="0.01" min="0" required />

          <label for="l-location">Pickup area</label>
          <input id="l-location" placeholder="e.g. Charlottetown" required />

          <label for="l-desc">Description (optional)</label>
          <textarea id="l-desc" rows="3" placeholder="Any notes for the buyer"></textarea>
        </div>

        <div>
          <label>Face-forward photo (for condition check)</label>
          <div class="photo-drop" id="photo-drop">
            <span id="photo-drop-label">Tap to take or choose a photo</span>
            <img id="photo-preview" class="hidden" />
          </div>
          <input type="file" id="l-photo" accept="image/*" capture="environment" class="hidden" required />
        </div>
      </div>

      <div class="field-error" id="l-error"></div>
      <button class="btn btn-primary" style="margin-top:16px;" type="submit">Post listing</button>
    </form>
  </section>

  <section id="tab-settings" class="panel hidden">
    <h2>Basic settings</h2>
    <label for="s-location">Your PEI location</label>
    <input id="s-location" />
    <button class="btn btn-secondary" id="save-settings" style="margin-top:14px;">Save</button>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  requireLogin();

  // --- tab switching ---
  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      ["posts", "new", "settings"].forEach((t) => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab);
      });
    });
  });

  // --- my listings ---
  async function loadMine() {
    const list = document.getElementById("my-listings");
    try {
      const data = await api("/api/listings/mine");
      if (!data.listings.length) {
        list.innerHTML = `<li>You haven't posted anything yet. Try the "Make a Listing" tab.</li>`;
        return;
      }
      list.innerHTML = data.listings.map(l => `
        <li>
          <span><strong>${escapeHtml(l.card_name)}</strong> — $${Number(l.price).toFixed(2)}
            <br><small style="opacity:0.65;">${escapeHtml(l.condition)} · posted ${timeAgo(l.created_at)}</small>
          </span>
          <button class="btn btn-outline btn-small" data-id="${l.id}">Remove</button>
        </li>
      `).join("");
      list.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Take this listing down?")) return;
          try {
            await api("/api/listings/" + btn.dataset.id, { method: "DELETE" });
            toast("Listing removed");
            loadMine();
          } catch (err) {
            toast(err.message);
          }
        });
      });
    } catch (err) {
      list.innerHTML = `<li>Couldn't load: ${escapeHtml(err.message)}</li>`;
    }
  }
  loadMine();

  // --- photo capture ---
  const photoInput = document.getElementById("l-photo");
  const photoDrop = document.getElementById("photo-drop");
  const photoPreview = document.getElementById("photo-preview");
  const photoLabel = document.getElementById("photo-drop-label");
  photoDrop.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (!file) return;
    photoPreview.src = URL.createObjectURL(file);
    photoPreview.classList.remove("hidden");
    photoLabel.classList.add("hidden");
  });

  // --- live market price lookup (debounced) ---
  let priceLookupTimer;
  let currentMarketPrice = null;
  document.getElementById("l-card").addEventListener("input", (e) => {
    clearTimeout(priceLookupTimer);
    const name = e.target.value.trim();
    const box = document.getElementById("price-suggest");
    if (name.length < 3) { box.classList.add("hidden"); return; }
    priceLookupTimer = setTimeout(async () => {
      try {
        const data = await api("/api/price?name=" + encodeURIComponent(name));
        currentMarketPrice = data.usd;
        box.classList.remove("hidden");
        box.innerHTML = data.usd
          ? `Market ref for <strong>${escapeHtml(data.name)}</strong> (${escapeHtml(data.set || "")}): <strong>$${Number(data.usd).toFixed(2)}</strong>`
          : `No live price found for "${escapeHtml(name)}" — you can still list it.`;
      } catch {
        box.classList.add("hidden");
      }
    }, 450);
  });

  // --- submit listing ---
  document.getElementById("listing-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("l-error");
    errorEl.textContent = "";
    if (!photoInput.files[0]) { errorEl.textContent = "A face-forward photo is required for condition verification."; return; }

    const fd = new FormData();
    fd.append("card_name", document.getElementById("l-card").value.trim());
    fd.append("set_name", document.getElementById("l-set").value.trim());
    fd.append("condition", document.getElementById("l-condition").value);
    fd.append("price", document.getElementById("l-price").value);
    fd.append("location", document.getElementById("l-location").value.trim());
    fd.append("description", document.getElementById("l-desc").value.trim());
    if (currentMarketPrice) fd.append("market_price", currentMarketPrice);
    fd.append("photo", photoInput.files[0]);

    try {
      await api("/api/listings", { method: "POST", body: fd, isForm: true });
      toast("Listing posted!");
      document.getElementById("listing-form").reset();
      photoPreview.classList.add("hidden");
      photoLabel.classList.remove("hidden");
      document.querySelector('.tabs button[data-tab="posts"]').click();
      loadMine();
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  // --- settings ---
  const user = Session.user();
  if (user) document.getElementById("s-location").value = user.location || "";
  document.getElementById("save-settings").addEventListener("click", async () => {
    try {
      const data = await api("/api/me", { method: "PATCH", body: { location: document.getElementById("s-location").value.trim() } });
      Session.save(data.user, Session.token());
      toast("Settings saved");
    } catch (err) {
      toast(err.message);
    }
  });
</script>
</body>
</html>
