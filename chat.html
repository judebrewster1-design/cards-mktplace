<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Shop — The Long Box</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="shop-sign">
  <div class="shop-sign__inner">
    <a href="index.html" class="shop-sign__title">🃏 The Long Box<small>PEI Card Exchange</small></a>
    <nav class="shop-nav">
      <a href="marketplace.html">Listings</a>
      <a href="wanted.html">Wanted</a>
      <a href="chat.html">Chat</a>
      <a href="dashboard.html" class="active">My Shop</a>
    </nav>
    <div class="shop-nav" id="nav-auth-slot"></div>
  </div>
</header>

<div class="wrap">
  <h1 class="page-title">My Shop</h1>
  <p class="page-sub">/// Basic settings, your active posts, and making new ones</p>

  <div class="tabs">
    <button class="active" data-tab="posts">My Posts</button>
    <button data-tab="new">Make a Listing</button>
    <button data-tab="settings">Settings</button>
  </div>

  <section id="tab-posts" class="panel">
    <h2>Your active posts</h2>
    <ul class="mini-list" id="my-listings">
      <li>Loading…</li>
    </ul>
  </section>

  <section id="tab-new" class="panel hidden">
    <h2>Make a listing</h2>
    <form id="listing-form">
      <div class="two-col">
        <div>
          <label for="l-card">Card name</label>
          <input id="l-card" required placeholder="Start typing… e.g. Lightning Bolt" autocomplete="off" />
          <div class="card-picker hidden" id="card-picker"></div>
          <div class="selected-card hidden" id="selected-card"></div>

          <label for="l-set">Set (optional)</label>
          <input id="l-set" placeholder="e.g. Dominaria Remastered" />

          <label for="l-condition">Condition</label>
          <select id="l-condition">
            <option>Near Mint</option>
            <option>Lightly Played</option>
            <option>Moderately Played</option>
            <option>Heavily Played</option>
            <option>Damaged</option>
          </select>

          <label for="l-price">Your price ($)</label>
          <input id="l-price" type="number" step="0.01" min="0" required />

          <label for="l-location">Pickup area</label>
          <input id="l-location" placeholder="e.g. Charlottetown" required />

          <label for="l-desc">Description (optional)</label>
          <textarea id="l-desc" rows="3" placeholder="Any notes for the buyer"></textarea>
        </div>

        <div>
          <label>Face-forward photo (for condition check)</label>
          <div class="photo-drop" id="photo-drop">
            <span id="photo-drop-label">Tap to take or choose a photo</span>
            <img id="photo-preview" class="hidden" />
          </div>
          <input type="file" id="l-photo" accept="image/*" capture="environment" class="hidden" required />
        </div>
      </div>

      <div class="field-error" id="l-error"></div>
      <button class="btn btn-primary" style="margin-top:16px;" type="submit">Post listing</button>
    </form>
  </section>

  <section id="tab-settings" class="panel hidden">
    <h2>Basic settings</h2>
    <label for="s-location">Your PEI location</label>
    <input id="s-location" />
    <button class="btn btn-secondary" id="save-settings" style="margin-top:14px;">Save</button>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  requireLogin();

  // --- tab switching ---
  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      ["posts", "new", "settings"].forEach((t) => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab);
      });
    });
  });

  // --- my listings ---
  async function loadMine() {
    const list = document.getElementById("my-listings");
    try {
      const data = await api("/api/listings/mine");
      if (!data.listings.length) {
        list.innerHTML = `<li>You haven't posted anything yet. Try the "Make a Listing" tab.</li>`;
        return;
      }
      list.innerHTML = data.listings.map(l => `
        <li>
          <span><strong>${escapeHtml(l.card_name)}</strong> — $${Number(l.price).toFixed(2)}
            <br><small style="opacity:0.65;">${escapeHtml(l.condition)} · posted ${timeAgo(l.created_at)}</small>
          </span>
          <button class="btn btn-outline btn-small" data-id="${l.id}">Remove</button>
        </li>
      `).join("");
      list.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Take this listing down?")) return;
          try {
            await api("/api/listings/" + btn.dataset.id, { method: "DELETE" });
            toast("Listing removed");
            loadMine();
          } catch (err) {
            toast(err.message);
          }
        });
      });
    } catch (err) {
      list.innerHTML = `<li>Couldn't load: ${escapeHtml(err.message)}</li>`;
    }
  }
  loadMine();

  // --- photo capture ---
  const photoInput = document.getElementById("l-photo");
  const photoDrop = document.getElementById("photo-drop");
  const photoPreview = document.getElementById("photo-preview");
  const photoLabel = document.getElementById("photo-drop-label");
  photoDrop.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (!file) return;
    photoPreview.src = URL.createObjectURL(file);
    photoPreview.classList.remove("hidden");
    photoLabel.classList.add("hidden");
  });

  // --- card search picker (grouped by set, foil-aware, load more) ---
  let searchTimer;
  let currentMarketPrice = null;
  let currentFoil = false;
  let lastResults = [];       // full printings list from the last search
  let visibleSetCount = 0;    // how many set-groups are currently rendered
  const SETS_PER_PAGE = 4;

  const cardInput = document.getElementById("l-card");
  const setInput = document.getElementById("l-set");
  const pickerBox = document.getElementById("card-picker");
  const selectedBox = document.getElementById("selected-card");

  function groupBySet(printings) {
    const groups = new Map();
    for (const p of printings) {
      const key = p.set_name || "Unknown set";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    return [...groups.entries()];
  }

  function renderPicker() {
    const groups = groupBySet(lastResults);
    if (!groups.length) {
      pickerBox.innerHTML = `<p class="card-picker__empty">No matching cards found on Scryfall — you can still type the name in manually and post without a market reference.</p>`;
      pickerBox.classList.remove("hidden");
      return;
    }
    const shown = groups.slice(0, visibleSetCount);
    pickerBox.innerHTML = shown.map(([setName, printings]) => `
      <div class="card-picker__set-group">
        <div class="card-picker__set-heading">${escapeHtml(setName)}</div>
        <div class="card-picker__grid">
          ${printings.map((p, i) => `
            <div class="card-picker__item" tabindex="0" role="button"
                 data-set="${escapeHtml(setName)}"
                 data-name="${escapeHtml(p.name)}" data-price="${p.usd ?? ""}" data-foil="${p.foil ? "1" : "0"}"
                 data-image="${escapeHtml(p.image || "")}">
              ${p.foil ? `<span class="card-picker__foil-chip">Foil</span>` : ""}
              <img src="${p.image || 'https://placehold.co/150x210?text=No+Image'}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/150x210?text=No+Image';" />
              <div class="card-picker__item-name">${escapeHtml(p.name)}</div>
              <div class="card-picker__item-price ${p.usd ? "" : "card-picker__item-price--none"}">${p.usd ? "$" + Number(p.usd).toFixed(2) + " CAD" : "no price"}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `).join("") + (groups.length > visibleSetCount
      ? `<div class="card-picker__more-wrap"><button type="button" class="btn btn-outline btn-small" id="picker-load-more">Load more sets (${groups.length - visibleSetCount} left)</button></div>`
      : "");
    pickerBox.classList.remove("hidden");

    pickerBox.querySelectorAll(".card-picker__item").forEach((el) => {
      el.addEventListener("click", () => selectPrinting(el.dataset));
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectPrinting(el.dataset); }
      });
    });
    const moreBtn = document.getElementById("picker-load-more");
    if (moreBtn) moreBtn.addEventListener("click", () => { visibleSetCount += SETS_PER_PAGE; renderPicker(); });
  }

  function selectPrinting(data) {
    cardInput.value = data.name;
    setInput.value = data.set;
    currentMarketPrice = data.price ? parseFloat(data.price) : null;
    currentFoil = data.foil === "1";
    pickerBox.classList.add("hidden");
    pickerBox.innerHTML = "";
    selectedBox.classList.remove("hidden");
    selectedBox.innerHTML = `
      <img src="${data.image || 'https://placehold.co/60x84?text=No+Image'}" alt="" onerror="this.onerror=null;this.src='https://placehold.co/60x84?text=No+Image';" />
      <span>${escapeHtml(data.name)}${data.foil === "1" ? ` <span class="foil-badge">Foil</span>` : ""} — ${escapeHtml(data.set)}
        <br>${currentMarketPrice ? "market ref: $" + currentMarketPrice.toFixed(2) + " CAD" : "no market price found"}
      </span>
      <button type="button" class="btn btn-outline btn-small" id="picker-change">Change</button>
    `;
    document.getElementById("picker-change").addEventListener("click", () => {
      selectedBox.classList.add("hidden");
      selectedBox.innerHTML = "";
      currentMarketPrice = null;
      currentFoil = false;
      cardInput.focus();
    });
  }

  cardInput.addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    // typing again after a selection means they're picking something new
    selectedBox.classList.add("hidden");
    selectedBox.innerHTML = "";
    currentMarketPrice = null;
    currentFoil = false;

    const q = e.target.value.trim();
    if (q.length < 3) { pickerBox.classList.add("hidden"); pickerBox.innerHTML = ""; lastResults = []; return; }
    searchTimer = setTimeout(async () => {
      try {
        const data = await api("/api/card-search?q=" + encodeURIComponent(q));
        lastResults = data.printings || [];
        visibleSetCount = SETS_PER_PAGE;
        renderPicker();
      } catch {
        pickerBox.classList.add("hidden");
      }
    }, 400);
  });

  // hide the picker if clicking elsewhere on the page
  document.addEventListener("click", (e) => {
    if (!pickerBox.contains(e.target) && e.target !== cardInput) pickerBox.classList.add("hidden");
  });
  cardInput.addEventListener("focus", () => { if (lastResults.length) pickerBox.classList.remove("hidden"); });

  // --- submit listing ---
  document.getElementById("listing-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("l-error");
    errorEl.textContent = "";
    if (!photoInput.files[0]) { errorEl.textContent = "A face-forward photo is required for condition verification."; return; }

    const fd = new FormData();
    fd.append("card_name", document.getElementById("l-card").value.trim());
    fd.append("set_name", document.getElementById("l-set").value.trim());
    fd.append("condition", document.getElementById("l-condition").value);
    fd.append("price", document.getElementById("l-price").value);
    fd.append("location", document.getElementById("l-location").value.trim());
    fd.append("description", document.getElementById("l-desc").value.trim());
    if (currentMarketPrice) fd.append("market_price", currentMarketPrice);
    fd.append("foil", currentFoil ? "1" : "0");
    fd.append("photo", photoInput.files[0]);

    try {
      await api("/api/listings", { method: "POST", body: fd, isForm: true });
      toast("Listing posted!");
      document.getElementById("listing-form").reset();
      photoPreview.classList.add("hidden");
      photoLabel.classList.remove("hidden");
      selectedBox.classList.add("hidden");
      selectedBox.innerHTML = "";
      pickerBox.classList.add("hidden");
      pickerBox.innerHTML = "";
      lastResults = [];
      currentMarketPrice = null;
      currentFoil = false;
      document.querySelector('.tabs button[data-tab="posts"]').click();
      loadMine();
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  // --- settings ---
  const user = Session.user();
  if (user) document.getElementById("s-location").value = user.location || "";
  document.getElementById("save-settings").addEventListener("click", async () => {
    try {
      const data = await api("/api/me", { method: "PATCH", body: { location: document.getElementById("s-location").value.trim() } });
      Session.save(data.user, Session.token());
      toast("Settings saved");
    } catch (err) {
      toast(err.message);
    }
  });
</script>
</body>
</html>
